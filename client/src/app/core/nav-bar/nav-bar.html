<nav class="navbar navbar-expand-lg navbar-light">
  <div class="container">
    <a  routerLink="/" class="navbar-brand">
      <img class="logo" src="./favicon.ico" alt="" />
      <i class="text-white">E-Commerce</i>
    </a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item"><a routerLink="/" class="nav-link" 
          routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a></li>
        <li class="nav-item"><a routerLink="/shop" class="nav-link">Shopping</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Best Seller</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
      </ul>

      <form class="form-inline mx-auto">
        <div class="input-group">
          <input type="text" class="form-control" placeholder="search..." name="" id="" />
          <div class="input-group-append">
            <button class="btn btn-light"><i class="material-icons">search</i></button>
          </div>
        </div>
      </form>

      <ul class="navbar-nav ml-auto align-items-center">
        <li class="nav-item">
          <a routerLink="/basket" class="nav-link position-relative">
            <i class="material-icons">shopping_cart</i>
            <span
              [matBadge]="getBasketCount(count | async)"
              matBadgeSize="large"
              class="custom-badge"
            >
            </span>
          </a>
        </li>
        <li class="nav-item dropdown">
          <a
            (click)="ToggleDropDown()"
            class="nav-link dropdown-toggle"
            id="navbarDropdown"
            role="button"
            aria-haspopup="true"
            aria-expanded="false"
          >
            <i class="material-icons">account_circle</i>
            <span *ngIf="isAuthenticated && userName" class="ms-1">{{ userName }}</span>
          </a>
          <div
            [ngClass]="{ show: visibale }"
            class="dropdown-menu dropdown-menu-right"
            aria-labelledby="navbarDropdown"
          >
            <ng-container *ngIf="!isAuthenticated; else authedMenu">
              <a class="dropdown-item" routerLink="/account/register"
                >Register <i class="fa fa-user-plus"></i
              ></a>
              <a class="dropdown-item" routerLink="/account/Login"
                >Login <i class="fa fa-sign-in"></i
              ></a>
            </ng-container>
            <ng-template #authedMenu>
              <a class="dropdown-item" matBadge="1" matBadgeSize="large" routerLink="/orders"
                >My Order <i class="fa fa-list"></i
              ></a>
              <a class="dropdown-item" href="#" (click)="logout(); $event.preventDefault()"
                >Logout <i class="fa fa-sign-out"></i
              ></a>
            </ng-template>
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>
